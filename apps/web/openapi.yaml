  /api/share/{token}:
    get:
      tags:
        - Sharing
      summary: Read a shared medical ID or timeline
      description: |-
        Read-only record for a doctor or first responder. Works only while the link is valid and not revoked; otherwise 404.

        **Who can call it:** anyone with a valid share link.
      operationId: get_share_token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Share token from the medical ID QR or a timeline link
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareRes"
        "404":
          description: Unknown, expired or revoked link (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
