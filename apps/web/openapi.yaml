  /api/assistant/chat:
    post:
      tags:
        - Assistant
      summary: Chat with the AI health assistant (streaming)
      description: |-
        Request: `{ session_id?: string, messages: UIMessage[] }` (Vercel AI SDK UI messages; only the text of the last 20 is used, and the last one must be from the user). Response: an AI SDK UI-message stream. A new session id is returned in the `x-session-id` header. The first chunk carries `messageMetadata.ai_run_id` for "Report a mistake".

        Answers cite pages from trusted health sites only; any other link is removed before it is sent. Emergency messages start with a fixed 108 / SOS notice.

        **Who can call it:** any signed-in user.
      operationId: assistant_chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatBody"
      responses:
        "200":
          description: Server-sent UI message stream
          headers:
            x-session-id:
              schema:
                type: string
                format: uuid
        "400":
          description: Invalid body, or the last message isn't from the user (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid token (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: "`session_id` is not one of the caller's conversations (`NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429":
          description: Over the limit of 20 calls per user in 10 minutes, shared with the other routes of the `ai_chat` group (`RATE_LIMITED`). Wait for the number of seconds in the `Retry-After` header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
  schemas:
    ApiErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - BAD_REQUEST
                - NOT_FOUND
                - UPSTREAM_TIMEOUT
                - UPSTREAM_ERROR
                - INTERNAL
                - RATE_LIMITED
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    BloodSearchReq:
      type: object
      properties:
        blood_group:
          type: string
          enum:
            - A+
            - A-
            - B+
            - B-
            - AB+
            - AB-
            - O+
            - O-
        component:
          type: string
          enum:
            - whole_blood
            - red_cells
            - platelets
            - plasma
        city:
          type: string
          minLength: 2
          maxLength: 60
      required:
        - blood_group
        - component
        - city
      additionalProperties: false
    BloodSearchRes:
      type: object
      properties:
        job_id:
          type: string
          minLength: 1
        query:
          type: string
        area:
          type: string
        banks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              address:
                type:
