  /api/medicines/interactions:
    post:
      tags:
        - Care
      summary: Check a patient's medicines for interactions
      description: |-
        A patient checks their own medicines (all current ones, or one prescription). A doctor checks a patient they treat by sending `prescription_id` or `patient_id`; any other doctor gets 403. Brand names are mapped to salts from a reviewed list (or a salt written in brackets); medicines that can't be mapped are listed in `not_checked`. Only a reviewed table of well-known interactions is checked (`layer: table`); every other pair of known medicines is listed in `not_checked` ("not in the reviewed list yet"). A combination is never called safe, and an empty result never means that nothing interacts.

        **Who can call it:** patient, doctor of the patient.
      operationId: post_medicines_interactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionsReq"
      responses:
