  /api/assistant/chat:
    post:
      tags:
        - Assistant
      summary: Chat with the AI health assistant (streaming)
      description: |-
        Request: `{ session_id?: string, messages: UIMessage[] }` (Vercel AI SDK UI messages). Response: an AI SDK UI-message stream. A new session id is returned in the `x-session-id` header. Answers cite trusted sources; emergency messages start with a 108 / SOS notice.

        **Who can call it:** any signed-in user.

        **TinyFish:** Search, Fetch (as assistant tools).
      operationId: assistant_chat
      responses:
        "200":
          description: Server-sent UI message stream
          headers:
            x-session-id:
              schema:
                type: string
                format: uuid
        "401":
          description: Missing or invalid token (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
