  /api/doctors/verify:
    post:
      tags:
        - Doctors
      summary: Send a doctor's registration, or record an admin's manual check of it
      description: |-
        Two cases, by the caller's role; nothing is looked up or verified automatically. A doctor sends their own registration number, state council and (when known) year of registration and stays `pending` (a doctor who is already `verified` and sends the same number and council stays `verified`). An admin who has checked the number in the public register by hand sends the doctor's id, a decision (`approve` or `reject`), the number, council and year exactly as the register shows them, and a note; `approve` marks the doctor `verified` (unless that number is already verified on another account, which answers 400), `reject` marks them `failed` and leaves the saved number as it was.

        **Who can call it:** doctor (sends own registration), admin (records a manual check).
      operationId: post_doctors_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorVerifyReq"
      responses:
        "200":
