  /api/prescriptions/basket:
    post:
      tags:
        - Prices
      summary: Start pricing a whole prescription across pharmacies
      description: |-
        Starts one web agent per pharmacy (1mg, PharmEasy, Netmeds, Apollo) for every medicine in the basket (a single-medicine check is a one-item basket) and returns at once with a `job_id` and `status: running` (pharmacies still working are `pending`). Poll `GET /api/prescriptions/basket/{job_id}` until `status: done`. A basket priced in the last 24 h comes back `done` and `cached: true`. Send `prescription_id` or `items`, not both.

        **Who can call it:** any signed-in user.

