  /api/prescriptions/basket/{job_id}:
    get:
      tags:
        - Prices
      summary: Check a basket pricing job
      description: |-
        Reports every pharmacy's basket. Finished pharmacies are checked by the server: product links must be on the pharmacy's own site, and a price counts (`price_verified`) only when it appears on the product page. Unverified prices are shown but not added to totals. Totals, ordering, the cheapest complete basket and savings are computed by the server. Only the user who started the job can read it; others get 404.

        **Who can call it:** the user who started the job.

        **TinyFish:** Agent runs (status), Fetch.
