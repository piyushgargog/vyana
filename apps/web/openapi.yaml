      description: |-
        Hospitals near the location that the live web lists as empanelled under PM-JAY, with their source links.

        **Who can call it:** any signed-in user.

        **TinyFish:** Search, Fetch.
      operationId: post_schemes_pmjay_hospitals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PmjayHospitalsReq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PmjayHospitalsRes"
        "400":
          description: Invalid request body (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid token (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Wrong role or not your data (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429":
          description: Over the limit of 10 calls per user in 1 hour, shared with the other routes of the `agent` group (`RATE_LIMITED`). Wait for the number of seconds in the `Retry-After` header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "502":
          description: An upstream service failed (`UPSTREAM_ERROR`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "504":
          description: An upstream service timed out (`UPSTREAM_TIMEOUT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /api/share/{token}:
    get:
      tags:
        - Sharing
      summary: Read a shared medical ID or timeline
      description: |-
        Read-only record for a doctor or first responder. Works only while the link is valid and not revoked; otherwise 404.

        **Who can call it:** anyone with a valid share link.
      operationId: get_share_token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Share token from the medical ID QR or a timeline link
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareRes"
        "404":
          description: Unknown, expired or revoked link (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /api/me/export:
    get:
      tags:
        - Account
      summary: Download all of my data
      description: |-
        Every record the signed-in user owns, as JSON.

        **Who can call it:** any signed-in user.
      operationId: get_me_export
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeExportRes"
        "401":
          description: Missing or invalid token (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Wrong role or not your data (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /api/me:
    delete:
      tags:
        - Account
      summary: Delete my account
      description: |-
        Deletes the user, all their records and their uploaded files. Requires a recent login.

        **Who can call it:** any signed-in user.
      operationId: delete_me
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkRes"
        "401":
          description: Missing or invalid token (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Wrong role or not your data (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /api/assistant/chat:
    post:
      tags:
        - Assistant
      summary: Chat with the AI health assistant (streaming)
      description: |-
        Request: `{ session_id?: string, messages: UIMessage[] }` (Vercel AI SDK UI messages; only the text of the last 20 is used, and the last one must be from the user). Response: an AI SDK UI-message stream. A new session id is returned in the `x-session-id` header. The first chunk carries `messageMetadata.ai_run_id` for "Report a mistake".

        Answers cite pages from trusted health sites only; any other link is removed before it is sent. Emergency messages start with a fixed 108 / SOS notice.

        **Who can call it:** any signed-in user.

        **TinyFish:** Search, Fetch (as assistant tools).
      operationId: assistant_chat
      responses:
        "200":
          description: Server-sent UI message stream
          headers:
            x-session-id:
              schema:
                type: string
                format: uuid
        "400":
          description: Invalid body, or the last message isn't from the user (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid token (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: "`session_id` is not one of the caller's conversations (`NOT_FOUND`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429":
          description: Over the limit of 20 calls per user in 10 minutes, shared with the other routes of the `ai_chat` group (`RATE_LIMITED`). Wait for the number of seconds in the `Retry-After` header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
