packages:
  - "apps/*"
  - "packages/*"

# Expo and Next must share one React copy, otherwise hooks from @vyana/shared break.
# Pinned to the version Expo SDK 57 expects.
overrides:
  react: 19.2.3
  react-dom: 19.2.3

allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.29 || 57.0.30"
  - "@expo/fingerprint@0.20.14"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - "@expo/prebuild-config@57.0.18 || 57.0.19"
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15 || 57.0.16
  - expo-modules-core@57.0.22 || 57.0.23
  - expo-modules-jsi@57.1.2
  - expo@57.0.28 || 57.0.29
  - "@expo/ui@57.0.23 || 57.0.24"
  - expo-router@57.0.26 || 57.0.27
  - expo-splash-screen@57.0.10
  - "@expo/metro-runtime@57.0.17"
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-notifications@57.0.23

# Dev-toolchain audit exceptions (issue #154). pnpm v11+ reads auditConfig only
# from this file, not from package.json. See SECURITY.md "Accepted risks".
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge, via @expo/cli
    - GHSA-vfj7-8cjw-p6xm # braces, via metro/eslint
    - GHSA-w5hq-g745-h8pq # uuid, via @expo/config-plugins
    - GHSA-vcc3-ghjq-m6fr # decode-uri-component, via expo-router
