packages:
  - "apps/*"
  - "packages/*"

# Expo and Next must share one React copy, otherwise hooks from @vyana/shared break.
# Pinned to the version Expo SDK 57 expects.
overrides:
  react: 19.2.3
  react-dom: 19.2.3

allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.29"
  - "@expo/fingerprint@0.20.14"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - "@expo/prebuild-config@57.0.18"
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo@57.0.28
  - "@expo/ui@57.0.23"
  - expo-router@57.0.26
  - expo-splash-screen@57.0.10
