# supabase/config.toml
# Local Supabase config for Vyana
# Owner: Vaibhav Parmar

project_id = "vyana"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.email.template.confirmation]
subject = "Confirm your Vyana account"
content_path = "./templates/confirm.html"

[auth.email.template.magic_link]
subject = "Your Vyana sign-in link"
content_path = "./templates/magic-link.html"

[auth.email.template.recovery]
subject = "Reset your Vyana password"
content_path = "./templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./templates/email-change.html"

[realtime]
enabled = true

