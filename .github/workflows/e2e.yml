name: E2E (Playwright)

# Nightly + manual, against the live site (issue #141).
# Credentials come from repository secrets; traces and screenshots upload only on failure.
# The tests never create data that stays.

on:
  schedule:
    - cron: "0 2 * * *" # 7:30 AM IST, nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run E2E against the live site
        run: pnpm e2e
        env:
          E2E_BASE_URL: https://vyanahealth.app
          E2E_PASSWORD_PATIENT: ${{ secrets.E2E_PASSWORD_PATIENT }}
          E2E_PASSWORD_DOCTOR: ${{ secrets.E2E_PASSWORD_DOCTOR }}
      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
