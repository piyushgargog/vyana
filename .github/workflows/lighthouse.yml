name: Lighthouse CI

# Issue #133 (P26): audit the public pages on pull requests that touch the web app.
# `/`, `/login` and `/privacy` are audited at the mobile and desktop presets.
# Accessibility below 95 or best-practices below 90 fails the run; performance
# below 80 only warns. The thresholds live in `lighthouserc.json` and the
# reports are uploaded as an artifact.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The mobile run uses Lighthouse's default emulation (mobile, all categories):
        # its "perf" preset would audit performance only. The desktop run uses the
        # "desktop" preset (desktop emulation, all categories).
        include:
          - name: mobile
            lhci_args: ""
          - name: desktop
            lhci_args: "--collect.settings.preset=desktop"
    env:
      # Mock env: the audit only renders public pages, no real backend is contacted.
      NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
      NEXT_PUBLIC_USE_MOCKS: "true"
      TINYFISH_MOCK: "1"
      LLM_MOCK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @vyana/web build
      - name: Run Lighthouse CI (${{ matrix.name }})
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json ${{ matrix.lhci_args }}
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.name }}
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: ignore
