name: OpenSSF Scorecard

# Weekly supply-chain health check (issue #133, ADR-067, modelled on DocuLens).
# Results go to code scanning as SARIF. The README carries the badge.

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 8:30 AM IST, weekly
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/scorecard.yml

permissions: {}

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF to code scanning
      contents: read
      id-token: write # Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
